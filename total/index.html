<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종합 순위 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 단합대회 종합 순위 — 레이스·두더지·성경 퀴즈·줄다리기·10초 맞히기 점수를 모아 조별·개인별 합산 */
:root{--bg:#1d1f24;--panel:#2a2d34;--line:#4a4d55;--ink:#fff;--mut:#9aa0ad;--gold:#ffd23f;--pink:#ff2e88;
  --race:#e9ff3b;--mole:#ffb547;--quiz:#b9a4ff;--tug:#6ee7b7;--ten:#7dd3fc}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans KR",system-ui,sans-serif}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:clamp(12px,1.6vw,22px) clamp(16px,2.4vw,36px);background:linear-gradient(90deg,var(--race),var(--mole),var(--quiz),var(--tug),var(--ten));color:#141414;border-bottom:6px solid #000}
h1{font:400 clamp(30px,3.6vw,56px)/1.05 "Black Han Sans",sans-serif;margin:0}
h1 em{font-style:normal;color:var(--pink)}
.games{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.gchip{appearance:none;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;background:#141414;color:#fff;border-radius:10px;padding:6px 12px;font:900 clamp(13px,1.1vw,16px) "Noto Sans KR",sans-serif;white-space:nowrap}
.gchip:hover{border-color:#fff}.gchip.sel{background:#fff;color:#141414;border-color:#141414}.gchip.all{background:var(--pink)}.gchip.all.sel{background:#fff}
.gchip i{width:10px;height:10px;border-radius:50%;background:#666;flex:none}
.gchip.idle i{background:#666}.gchip.run i{background:#2bd46b;animation:pl 1s infinite}.gchip.end i{background:var(--gold)}
@keyframes pl{50%{opacity:.35}}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(14px,2vw,32px);padding:clamp(14px,2vw,32px)}
@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr)}header{grid-template-columns:minmax(0,1fr)}.games{justify-content:flex-start}}
section{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:clamp(14px,1.6vw,24px)}
h2{font:400 clamp(24px,2.4vw,40px) "Black Han Sans",sans-serif;margin:0 0 4px;color:var(--gold)}
.sub{font:700 clamp(12px,1vw,15px) "Noto Sans KR",sans-serif;color:var(--mut);margin:0 0 14px}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{font:900 clamp(12px,1vw,15px) "Noto Sans KR",sans-serif;color:var(--mut);text-align:right;padding:0 8px;white-space:nowrap}
th:nth-child(1),th:nth-child(2){text-align:left}
td{background:#33363e;padding:10px 8px;text-align:right;font:400 clamp(18px,1.7vw,28px) "Black Han Sans",sans-serif;white-space:nowrap}
td:first-child{border-radius:12px 0 0 12px;text-align:center;color:var(--mut);width:2.2em}
td:last-child{border-radius:0 12px 12px 0}
td.nm{text-align:left;font:900 clamp(17px,1.6vw,26px) "Noto Sans KR",sans-serif;white-space:normal;overflow-wrap:anywhere}
td.nm small{display:block;font:700 clamp(11px,.9vw,14px) "Noto Sans KR",sans-serif;color:var(--mut)}
td.g{font-size:clamp(15px,1.3vw,21px);color:#d9dde6}
td.g.race{color:var(--race)}td.g.mole{color:var(--mole)}td.g.quiz{color:var(--quiz)}td.g.tug{color:var(--tug)}td.g.ten{color:var(--ten)}
td.g small{display:block;font:700 11px "Noto Sans KR",sans-serif;color:var(--mut)}
td.tot{font-size:clamp(24px,2.4vw,40px);color:#fff}
tr.r1 td{background:#4a4530}tr.r1 td:first-child{color:var(--gold);font-size:clamp(24px,2.2vw,36px)}
tr.r2 td:first-child{color:#d9dde6}tr.r3 td:first-child{color:#e8a26a}
.bar{height:8px;background:#3a3d45;border-radius:6px;overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.bar .race{background:var(--race)}.bar .mole{background:var(--mole)}.bar .quiz{background:var(--quiz)}.bar .tug{background:var(--tug)}.bar .ten{background:var(--ten)}.bar .bo{background:var(--pink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font:700 13px "Noto Sans KR",sans-serif;color:var(--mut);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.empty{color:var(--mut);font:900 clamp(16px,1.4vw,22px) "Noto Sans KR",sans-serif;text-align:center;padding:40px 10px}
.more{color:var(--mut);font:900 14px "Noto Sans KR",sans-serif;text-align:center;margin:6px 0 0}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:0 clamp(14px,2vw,32px) 20px;color:var(--mut);font-size:13px}
footer button{appearance:none;border:2px solid var(--line);background:transparent;color:#d9dde6;border-radius:10px;padding:8px 14px;font:900 14px "Noto Sans KR",sans-serif;cursor:pointer}
footer button:hover{border-color:#d9dde6}
.full section{max-width:none}
#allBox{display:none}#allBox.on{display:block;margin:0 clamp(14px,2vw,32px) 20px}
@media (prefers-reduced-motion:reduce){.gchip.run i{animation:none}}
</style>
</head>
<body>
<header>
  <h1 id="mainH">단합대회 <em>종합</em> 순위</h1>
  <div class="games" id="games"></div>
</header>
<main>
  <section>
    <h2 id="tH">👥 조별 종합</h2>
    <p class="sub" id="tSub">게임별 조 점수(조원 점수 합 + 개인 1·2·3등 보너스)를 모두 더한 값</p>
    <div id="teams"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section>
    <h2 id="pH">🏅 개인 종합 TOP 10</h2>
    <p class="sub" id="pSub">모든 게임에서 받은 개인 점수의 합 (같은 폰으로 참가하면 한 사람으로 합산)</p>
    <div id="people"></div>
  </section>
</main>
<div id="allBox"><section><h2 id="aH">📋 개인 종합 전체 순위</h2><div id="allList"></div></section></div>
<footer>
  <span id="conn">연결 중…</span>
  <span><button id="toggleAll">개인 전체 순위 보기</button> <button id="copy">결과 복사 (엑셀)</button></span>
</footer>

<script>
{
const $=s=>document.querySelector(s);
const ROOT="https://ntfy.sh/hdk-retreat-r7k2m9";
/* 게임 목록 — 각 게임 파일의 BASE·SALT·시간과 같아야 함 */
const GAMES=[
  {id:"race",name:"레이스",base:ROOT,salt:"RETREAT-2026",sec:60},
  {id:"mole",name:"두더지",base:ROOT+"-mole",salt:"RETREAT-2026-MOLE",sec:60},
  {id:"quiz",name:"성경퀴즈",base:ROOT+"-quiz",salt:"RETREAT-2026-QUIZ",sec:180},
  {id:"tug",name:"줄다리기",base:ROOT+"-tug",salt:"RETREAT-2026-TUG",sec:30},
  {id:"ten",name:"10초",base:ROOT+"-ten",salt:"RETREAT-2026-TEN",sec:60}
];
const COUNT=5,BONUS=[20,10,5];
const hashCode=s=>{let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36).toUpperCase().padStart(6,"0").slice(-4)};
const normG=v=>{let g=String(v||"").replace(/\s+/g,"").slice(0,8);if(/^\d+$/.test(g))g+="조";return g};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byG=(a,b)=>a.localeCompare(b,"ko",{numeric:true});

let view="all";                     /* "all" = 종합, 아니면 게임 id */
const ov=new Map();                 /* 관리자가 고친 이름·조: d -> {n,g,t} (가장 최근 것) */
for(const g of GAMES){g.cur=null;g.resetAt=0;g.rows=new Map();g.ok=[false,false]}

function listen(url,onMsg,g,i){
  const es=new EventSource(url+"/sse?since=all");
  es.onopen=()=>{g.ok[i]=true;later()};
  es.onerror=()=>{g.ok[i]=false;later()};
  es.onmessage=e=>{let m,x;try{m=JSON.parse(e.data);if(m.event!=="message")return;x=JSON.parse(m.message)}catch(_){return}if(x)onMsg(x,(m.time||0)*1000)};
}
for(const g of GAMES){
  listen(g.base+"-ctl",(x,t)=>{
    if(x.type==="reset"){if(t>g.resetAt){g.resetAt=t;if(g.cur&&g.cur.sent<=t)g.cur=null}later();return}
    if(x.type==="start"&&typeof x.rid==="string"&&t>=g.resetAt&&(!g.cur||t>=g.cur.sent)){g.cur={rid:x.rid.slice(0,16),sent:t,endAt:t+(COUNT+g.sec)*1000};later()}
  },g,0);
  listen(g.base+"-res",(x,t)=>{
    if(typeof x.d!=="string"||typeof x.n!=="string")return;
    if(x.t==="e"){const p=ov.get(x.d);if(!p||t>=p.t)ov.set(x.d,{n:x.n.slice(0,10),g:normG(x.g),t});later();return}
    if((x.t!=="p"&&x.t!=="f")||typeof x.rid!=="string")return;
    let rows=g.rows.get(x.rid);if(!rows){rows=new Map();g.rows.set(x.rid,rows)}
    const prev=rows.get(x.d);if(prev&&prev.f&&x.t!=="f")return;
    const n0=x.n.slice(0,10),s=+x.s||0,ok=+x.ok||0;
    rows.set(x.d,{d:x.d,n0,g0:normG(x.g),s,ok,b:+x.b||0,at:+x.at||0,f:x.t==="f",t,valid:x.c===hashCode(`${n0}|${s}|${ok}|${g.salt}`)});
    later();
  },g,1);
}

/* 한 게임의 최근 판 → 개인 순위(동점 처리)와 보너스 */
function gameResult(g){
  const rows=g.cur&&g.rows.get(g.cur.rid);if(!rows)return [];
  const list=[...rows.values()].filter(x=>x.valid).map(x=>{const o=ov.get(x.d);return {...x,n:o?o.n:x.n0,g:o?o.g:x.g0}})
    .sort((a,b)=>b.s-a.s||b.ok-a.ok||b.b-a.b||a.at-b.at);
  let rk=0;list.forEach((x,i)=>{rk=(i&&x.s===list[i-1].s&&x.ok===list[i-1].ok)?rk:i+1;x.rk=rk;x.bo=rk<=3?BONUS[rk-1]:0});
  return list;
}
function compute(){
  const teams=new Map(),people=new Map();
  for(const g of GAMES){
    for(const x of gameResult(g)){
      const k=x.g||"조 없음";
      const T=teams.get(k)||{k,per:{},bo:0,tot:0,mem:new Set()};
      const tp=T.per[g.id]||{s:0,bo:0};tp.s+=x.s;tp.bo+=x.bo;T.per[g.id]=tp;T.mem.add(x.d);teams.set(k,T);
      const P=people.get(x.d)||{d:x.d,n:x.n,g:x.g,per:{},tot:0,last:0};
      P.per[g.id]=x.s;if(x.t>=P.last){P.last=x.t;P.n=x.n;P.g=x.g}people.set(x.d,P);
    }
  }
  for(const T of teams.values()){T.tot=0;for(const id in T.per)T.tot+=T.per[id].s+T.per[id].bo}
  for(const P of people.values()){const o=ov.get(P.d);if(o){P.n=o.n;P.g=o.g}P.tot=Object.values(P.per).reduce((a,b)=>a+b,0)}
  const ts=[...teams.values()].sort((a,b)=>b.tot-a.tot||byG(a.k,b.k));
  const ps=[...people.values()].sort((a,b)=>b.tot-a.tot||Object.keys(b.per).length-Object.keys(a.per).length||byG(a.n,b.n));
  let r=0;ts.forEach((x,i)=>{r=i&&x.tot===ts[i-1].tot?r:i+1;x.rk=r});
  r=0;ps.forEach((x,i)=>{r=i&&x.tot===ps[i-1].tot?r:i+1;x.rk=r});
  return {ts,ps};
}
const cell=(v,id,sub)=>`<td class="g ${id}">${v==null?"–":v}${sub?`<small>${sub}</small>`:""}</td>`;
const rc=rk=>rk<=3?` class="r${rk}"`:"";
function peopleTable(list){
  return `<table><thead><tr><th>#</th><th>이름</th>${GAMES.map(g=>`<th>${g.name}</th>`).join("")}<th>합계</th></tr></thead><tbody>${
    list.map(p=>`<tr${rc(p.rk)}><td>${p.rk}</td><td class="nm">${esc(p.n)}<small>${esc(p.g||"조 없음")}</small></td>${GAMES.map(g=>cell(p.per[g.id],g.id)).join("")}<td class="tot">${p.tot}</td></tr>`).join("")}</tbody></table>`;
}
let last={kind:"all",ts:[],ps:[]};
const gname=id=>(GAMES.find(g=>g.id===id)||{}).name;
/* 한 게임만 보기: 조별(점수합+보너스, 줄다리기는 1인 평균도)·개인 순위 */
function computeGame(g){
  const list=gameResult(g),tm=new Map();
  for(const x of list){const k=x.g||"조 없음";const T=tm.get(k)||{k,n:0,s:0,bo:0};T.n++;T.s+=x.s;T.bo+=x.bo;tm.set(k,T)}
  const ts=[...tm.values()].map(T=>({...T,tot:T.s+T.bo,avg:Math.round(T.s/T.n)})).sort((a,b)=>b.tot-a.tot||byG(a.k,b.k));
  let r=0;ts.forEach((x,i)=>{r=i&&x.tot===ts[i-1].tot?r:i+1;x.rk=r});
  return {kind:"game",g,ts,ps:list};
}
function gamePeople(list){
  return `<table><thead><tr><th>#</th><th>이름</th><th>점수</th><th>조 보너스</th></tr></thead><tbody>${
    list.map(p=>`<tr${rc(p.rk)}><td>${p.rk<=3?["🥇","🥈","🥉"][p.rk-1]:p.rk}</td><td class="nm">${esc(p.n)}<small>${esc(p.g||"조 없음")}</small></td><td class="tot">${p.s}</td><td class="g">${p.bo?"+"+p.bo:"–"}</td></tr>`).join("")}</tbody></table>`;
}
function render(){
  const now=Date.now();
  $("#games").innerHTML=`<button class="gchip all${view==="all"?" sel":""}" data-v="all">🏆 종합</button>`+GAMES.map(g=>{const c=g.cur,st=!c?"idle":now<c.endAt?"run":"end";
    return `<button class="gchip ${st}${view===g.id?" sel":""}" data-v="${g.id}"><i></i>${g.name} · ${st==="idle"?"대기":st==="run"?"진행 중":"완료"}</button>`}).join("");
  const okN=GAMES.filter(g=>g.ok[0]&&g.ok[1]).length;
  $("#conn").textContent=(okN===GAMES.length?"● 모든 게임 실시간 연결됨":`○ 연결 중… (${okN}/${GAMES.length})`)+" · 각 게임의 가장 최근 판 기준 · 위 버튼으로 게임별 성적 보기";
  const bonusTxt=`개인 1·2·3등 보너스 (+${BONUS.join(" / +")})`;
  if(view==="all"){
    $("#mainH").innerHTML="단합대회 <em>종합</em> 순위";
    $("#tH").textContent="👥 조별 종합";$("#tSub").textContent="게임별 조 점수(조원 점수 합 + 개인 1·2·3등 보너스)를 모두 더한 값";
    $("#pH").textContent="🏅 개인 종합 TOP 10";$("#pSub").textContent="모든 게임에서 받은 개인 점수의 합 (같은 폰으로 참가하면 한 사람으로 합산)";
    $("#aH").textContent="📋 개인 종합 전체 순위";
    const {ts,ps}=compute();last={kind:"all",ts,ps};
    if(!ts.length)$("#teams").innerHTML=`<p class="empty">아직 점수가 없어요.<br>게임을 하면 여기에 조별 점수가 쌓여요.</p>`;
    else{
      const top=Math.max(1,ts[0].tot);
      $("#teams").innerHTML=`<table><thead><tr><th>#</th><th>조</th>${GAMES.map(g=>`<th>${g.name}</th>`).join("")}<th>종합</th></tr></thead><tbody>${
        ts.map(T=>`<tr${rc(T.rk)}><td>${T.rk}</td><td class="nm">${esc(T.k)}<small>${T.mem.size}명 참가</small><div class="bar">${
          GAMES.map(g=>{const p=T.per[g.id];return p?`<i class="${g.id}" style="width:${p.s/top*100}%"></i>`:""}).join("")}<i class="bo" style="width:${GAMES.reduce((a,g)=>a+(T.per[g.id]?T.per[g.id].bo:0),0)/top*100}%"></i></div></td>${
          GAMES.map(g=>{const p=T.per[g.id];return cell(p?p.s+p.bo:null,g.id,p&&p.bo?`보너스 +${p.bo}`:"")}).join("")}<td class="tot">${T.tot}</td></tr>`).join("")}</tbody></table>`;
    }
    $("#legend").innerHTML=GAMES.map(g=>`<span style="--c:var(--${g.id})">${g.name}</span>`).join("")+`<span style="--c:var(--pink)">${bonusTxt}</span>`;
    $("#people").innerHTML=ps.length?peopleTable(ps.slice(0,10))+(ps.length>10?`<p class="more">그 외 ${ps.length-10}명 · 아래 '개인 전체 순위 보기'</p>`:""):`<p class="empty">아직 기록이 없어요.</p>`;
    if($("#allBox").classList.contains("on"))$("#allList").innerHTML=ps.length?peopleTable(ps):`<p class="empty">아직 기록이 없어요.</p>`;
    return;
  }
  /* 게임 하나 */
  const g=GAMES.find(x=>x.id===view),R=computeGame(g);last=R;
  const isTap=g.id==="tug";
  $("#mainH").innerHTML=`<em>${esc(g.name)}</em> 성적`;
  $("#tH").textContent=`👥 조별 순위 · ${g.name}`;
  $("#tSub").textContent=isTap?"총점 = 조원 점수 합 + 개인 1·2·3등 보너스 (종합에 들어가는 점수) · 줄다리기 승부는 1인 평균":"총점 = 조원 점수 합 + 개인 1·2·3등 보너스 (종합에 들어가는 점수)";
  $("#pH").textContent=`🏅 개인 순위 · ${g.name} TOP 10`;$("#pSub").textContent="이 게임의 가장 최근 판 기록";
  $("#aH").textContent=`📋 ${g.name} 개인 전체 순위`;
  const ts=R.ts,ps=R.ps;
  if(!ts.length)$("#teams").innerHTML=`<p class="empty">${g.cur?"아직 기록이 들어오지 않았어요.":"아직 이 게임을 하지 않았어요."}</p>`;
  else{
    const top=Math.max(1,ts[0].tot);
    $("#teams").innerHTML=`<table><thead><tr><th>#</th><th>조</th><th>점수합</th><th>보너스</th>${isTap?"<th>1인 평균</th>":""}<th>총점</th></tr></thead><tbody>${
      ts.map(T=>`<tr${rc(T.rk)}><td>${T.rk}</td><td class="nm">${esc(T.k)}<small>${T.n}명</small><div class="bar"><i class="${g.id}" style="width:${T.s/top*100}%"></i><i class="bo" style="width:${T.bo/top*100}%"></i></div></td><td class="g ${g.id}">${T.s}</td><td class="g">${T.bo?"+"+T.bo:"–"}</td>${isTap?`<td class="g ${g.id}">${T.avg}</td>`:""}<td class="tot">${T.tot}</td></tr>`).join("")}</tbody></table>`;
  }
  $("#legend").innerHTML=`<span style="--c:var(--${g.id})">${g.name} 점수</span><span style="--c:var(--pink)">${bonusTxt}</span>`;
  $("#people").innerHTML=ps.length?gamePeople(ps.slice(0,10))+(ps.length>10?`<p class="more">그 외 ${ps.length-10}명 · 아래 '개인 전체 순위 보기'</p>`:""):`<p class="empty">아직 기록이 없어요.</p>`;
  if($("#allBox").classList.contains("on"))$("#allList").innerHTML=ps.length?gamePeople(ps):`<p class="empty">아직 기록이 없어요.</p>`;
}
$("#games").addEventListener("click",e=>{const b=e.target.closest(".gchip");if(!b)return;view=b.dataset.v;render()});
let rt=null;const later=()=>{clearTimeout(rt);rt=setTimeout(render,400)};
setInterval(render,3000);
$("#toggleAll").addEventListener("click",()=>{const on=$("#allBox").classList.toggle("on");$("#toggleAll").textContent=on?"개인 전체 순위 닫기":"개인 전체 순위 보기";render();if(on)$("#allBox").scrollIntoView({behavior:"smooth"})});
$("#copy").addEventListener("click",()=>{
  const b=$("#copy");let tsv;
  if(last.kind==="all"){
    const {ts,ps}=last;
    tsv=[["조별 종합 순위","조",...GAMES.map(g=>g.name),"보너스 합","종합"].join("\t")]
      .concat(ts.map(T=>[T.rk,T.k,...GAMES.map(g=>T.per[g.id]?T.per[g.id].s+T.per[g.id].bo:""),GAMES.reduce((a,g)=>a+(T.per[g.id]?T.per[g.id].bo:0),0),T.tot].join("\t")))
      .concat(["",["개인 종합 순위","이름","조",...GAMES.map(g=>g.name),"합계"].join("\t")])
      .concat(ps.map(p=>[p.rk,p.n,p.g,...GAMES.map(g=>p.per[g.id]??""),p.tot].join("\t"))).join("\n");
  }else{
    const {g,ts,ps}=last;
    tsv=[[`${g.name} 조별 순위`,"조","인원","점수합","보너스","1인 평균","총점"].join("\t")]
      .concat(ts.map(T=>[T.rk,T.k,T.n,T.s,T.bo,T.avg,T.tot].join("\t")))
      .concat(["",[`${g.name} 개인 순위`,"이름","조","점수","조 보너스"].join("\t")])
      .concat(ps.map(p=>[p.rk,p.n,p.g,p.s,p.bo].join("\t"))).join("\n");
  }
  navigator.clipboard.writeText(tsv).then(()=>{b.textContent="✓ 복사됨 — 엑셀에 붙여넣으세요";setTimeout(()=>b.textContent="결과 복사 (엑셀)",2500)},()=>{b.textContent="복사 실패"});
});
render();
}
</script>
</body>
</html>
