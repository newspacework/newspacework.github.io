<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔔 성경 골든벨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 성경 골든벨 — 크림 바탕, 남색 글씨, 금색 종. 폰은 세로 한 화면, 큰 화면은 TV 퀴즈쇼 */
:root{--bg:#fff6dc;--ink:#1c1d3f;--card:#fff;--gold:#ffbf1f;--gold2:#e09a00;--line:#1c1d3f;--mut:#5b5d7a;--ok:#16a34a;--no:#e11d48;
  --c0:#ef4444;--c1:#2f7cf6;--c2:#16a34a;--c3:#9b5cf6;--o:#2f7cf6;--x:#ef4444}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;touch-action:manipulation}
.scr{display:none;min-height:100%;max-width:560px;margin:0 auto;padding:18px 16px 30px;flex-direction:column;gap:14px}
.scr.on{display:flex}
h1{font:400 clamp(38px,11vw,54px)/1.05 "Black Han Sans",sans-serif;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold2)}
h2{font:400 24px/1.2 "Black Han Sans",sans-serif;margin:0}
h3{font:900 17px/1.3 "Noto Sans KR",sans-serif;margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;box-shadow:5px 5px 0 var(--line)}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--gold) 0 12px,var(--line) 12px 24px);border-radius:3px}
label{font-weight:700;font-size:15px;display:block}
input,textarea,select{width:100%;font:700 18px "Noto Sans KR",sans-serif;padding:11px 13px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:6px}
textarea{font-size:15px;font-weight:500;min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:2px}
.btn{appearance:none;border:3px solid var(--line);background:var(--gold);color:var(--ink);font:400 25px "Black Han Sans",sans-serif;padding:14px;border-radius:16px;box-shadow:4px 4px 0 var(--line);cursor:pointer;width:100%}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.sub{background:#fff;font-size:18px;padding:11px}
.btn.dark{background:var(--ink);color:#fff}
.btn.red{background:var(--no);color:#fff}
.note{font-size:13px;color:var(--mut);margin:0}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:3px solid var(--line);background:#fff;color:var(--ink);font:900 17px "Noto Sans KR",sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.chip.sm{font-size:14px;padding:5px 11px;border-width:2px}
.dept{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:6px}
.dept .chip{font:400 26px "Black Han Sans",sans-serif;padding:16px 8px;border-radius:16px}
.dept.many{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.dept.many .chip{font:900 17px "Noto Sans KR",sans-serif;padding:11px 4px;border-radius:12px}
.drow{display:flex;gap:8px;align-items:center;margin-top:6px}.drow input{margin:0;padding:9px 12px;font-size:17px}.drow .mini{flex:none}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bell{display:inline-block;transform-origin:50% 10%;animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(14deg)}80%{transform:rotate(-12deg)}85%{transform:rotate(8deg)}90%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion:reduce){.bell{animation:none}}
.foot{text-align:center;margin-top:auto;padding-top:10px}
.foot a{color:var(--mut);font-size:13px;margin:0 8px}

/* ---------- 학생 문제 화면 ---------- */
.qhd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900}
.qno{font:400 30px/1 "Black Han Sans",sans-serif}
.tag{display:inline-block;font:900 13px "Noto Sans KR",sans-serif;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}
.tag.g{background:var(--gold);color:var(--ink)}
.tag.ns{background:#ff7ab8;color:#fff}
.tbar{height:14px;border:3px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.tbar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .2s linear}
.hurry .tbar i{background:var(--no)}
.tleft{font:400 44px/1 "Black Han Sans",sans-serif;text-align:center}
.hurry .tleft{color:var(--no)}
.qtext{font:900 clamp(20px,5.8vw,26px)/1.45 "Noto Sans KR",sans-serif;margin:0;word-break:keep-all;text-align:center}
.qtext .cand{display:block;margin-top:10px;font-size:1.15em;color:var(--gold2)}
.opts{display:grid;gap:10px}
.opt{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);color:#fff;font:900 clamp(18px,5.4vw,23px)/1.3 "Noto Sans KR",sans-serif;min-height:66px;border-radius:14px;box-shadow:4px 4px 0 var(--line);cursor:pointer;padding:10px 14px;word-break:keep-all}
.opt b{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font:400 20px "Black Han Sans",sans-serif}
.opt:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2)}.o3{background:var(--c3)}
.oxs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox{appearance:none;border:3px solid var(--line);color:#fff;font:400 96px/1 "Black Han Sans",sans-serif;min-height:170px;border-radius:20px;box-shadow:5px 5px 0 var(--line);cursor:pointer}
.ox.O{background:var(--o)}.ox.X{background:var(--x)}
.opt.dim,.ox.dim{opacity:.28}
.opt.pick,.ox.pick{outline:5px solid var(--gold);outline-offset:3px}
.sain{font-size:24px;text-align:center}
.status{text-align:center;font-weight:900;font-size:18px;margin:0}
.resbig{font:400 clamp(64px,22vw,110px)/1 "Black Han Sans",sans-serif;text-align:center;margin:4px 0}
.resbig.ok{color:var(--ok)}.resbig.no{color:var(--no)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 div{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 4px}
.stat3 b{display:block;font:400 30px/1.1 "Black Han Sans",sans-serif}
.stat3 span{font-size:12px;font-weight:700;color:var(--mut)}
.ansbox{background:#fff;border:3px dashed var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:900}
.ansbox small{display:block;font-weight:700;color:var(--mut);font-size:13px}
.out{background:var(--ink);color:#fff;border-radius:16px;padding:16px;text-align:center}
.out b{font:400 34px/1.2 "Black Han Sans",sans-serif;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.conn{font-size:12px;color:var(--mut);text-align:center;margin:0}

/* ---------- 관리자 ---------- */
#admin{max-width:820px}
.sec{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.tog{display:flex;align-items:center;gap:10px;font-weight:900;cursor:pointer;user-select:none}
.tog input{width:26px;height:26px;margin:0;accent-color:var(--ink);flex:none}
.num{width:88px!important;text-align:center;padding:8px!important;margin:0!important;font-size:18px!important}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:2px dashed #d9d3bd}
.trow:first-child{border-top:0}
.trow .tog{flex:1;min-width:150px}
.unit{font-weight:700;color:var(--mut)}
.compose{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.7}
.compose b{color:var(--gold)}
.warn{color:var(--no);font-weight:900;font-size:14px;margin:0}
.booklist{font-size:14px;line-height:1.8}
.booklist span{display:inline-block;background:#fff3c4;border:2px solid var(--line);border-radius:8px;padding:0 7px;margin:2px 3px 2px 0;font-weight:700}
.bgrid{display:flex;flex-direction:column;gap:10px}
.bgrid .tst{font:400 22px "Black Han Sans",sans-serif;margin:4px 0 0;display:flex;align-items:center;gap:8px}
.bgrid .sec2{border:2px solid #e6dfc5;border-radius:12px;padding:8px;background:#fffdf5}
.bgrid .sh{appearance:none;border:0;background:none;font:900 14px "Noto Sans KR",sans-serif;color:var(--mut);cursor:pointer;padding:0 0 6px;display:flex;gap:6px;align-items:center}
.bgrid .sh.on{color:var(--ink)}
.bgrid .bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.bk{appearance:none;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:6px 4px;font:900 14px "Noto Sans KR",sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;word-break:keep-all}
.bk small{font-size:11px;font-weight:700;color:var(--mut)}
.bk.on{background:var(--ink);color:#fff}.bk.on small{color:var(--gold)}
.booklist span.zero{background:#eee;color:#999;border-color:#bbb}
.deck{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto;padding-right:4px}
.dq .mv{display:flex;flex-direction:column;gap:4px}.dq .mv .mini{padding:4px 9px}.dq .mv .mini:disabled{opacity:.3}
.dq[draggable]{cursor:grab;transition:background .3s}
.dq{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px}
.dq .n{font:400 20px "Black Han Sans",sans-serif;text-align:center}
.dq .t{font-size:15px;font-weight:700;word-break:keep-all}
.dq .a{font-size:13px;color:var(--ok);font-weight:900}
.dq .m{font-size:12px;color:var(--mut)}
.mini{appearance:none;border:2px solid var(--line);background:#fff;border-radius:10px;font:900 13px "Noto Sans KR",sans-serif;padding:6px 9px;cursor:pointer;white-space:nowrap}
.mini.on{background:var(--ink);color:#fff}
.alinks{display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
.alinks a,.alinks button{appearance:none;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:6px 10px;font:900 14px "Noto Sans KR",sans-serif;text-decoration:none;cursor:pointer}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keyans{background:#e8ffe9;border:3px solid var(--ok);border-radius:12px;padding:10px;font-weight:900;cursor:pointer;user-select:none}
.keyans.hide span{filter:blur(8px)}
.prog{font:400 38px/1 "Black Han Sans",sans-serif;text-align:center}
.salist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.sa{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;cursor:pointer;font-weight:900}
.sa.ok{background:#dcfce7;border-color:var(--ok)}
.sa em{font-style:normal;margin-left:auto;color:var(--mut);font-size:14px}
.sa i{font-style:normal;font-size:20px}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th,.ptable td{border-bottom:1px solid #ddd5bb;padding:6px 4px;text-align:left}
.ptable td.r{text-align:right;font-weight:900}
.ptable tr.ex td{opacity:.4;text-decoration:line-through}
.ptable tr.dead td:not(:last-child){color:#999}
.clsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cls{appearance:none;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.cls.on{background:var(--ink);color:#fff}.cls.on .nm{color:#ddd}
.cls b{font:400 20px "Black Han Sans",sans-serif;display:flex;justify-content:space-between;gap:6px}
.cls .nm{font-size:12px;color:var(--mut);line-height:1.4;margin-top:2px;max-height:3.4em;overflow:hidden}
.cls.zero{opacity:.55}
.t10s{display:flex;flex-direction:column;gap:5px}
.t10{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:900}
.t10:nth-child(-n+3){background:#fff3c4}
.t10 b{font:400 20px "Black Han Sans",sans-serif;text-align:center}
.t10 em{font-style:normal;font-size:12px;color:var(--mut);font-weight:700}
.t10 .s{font:400 22px "Black Han Sans",sans-serif}
.t10.dead{opacity:.5}
.subm{display:flex;flex-direction:column;gap:8px;background:#faf7ea;border-radius:12px;padding:10px}
.subm b{font-size:14px}.subm b.wait{color:#b45309}.subm b.no{color:var(--no)}.subm b.okb{color:var(--ok)}
.sgrp{background:#fff;border:2px solid #e6dfc5;border-radius:10px;padding:6px 8px}
.sgh{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}.sgh b{font:400 17px "Black Han Sans",sans-serif}.sgh span{font-weight:900;color:var(--mut);font-size:13px}
.sbs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.subm{max-height:55vh;overflow:auto}
.sb{border-radius:8px;padding:3px 8px;font-size:13px;font-weight:900;border:2px solid}
.sb em{font-style:normal;font-weight:700;font-size:11px;margin-left:3px;opacity:.7}
.sb.ok{border-color:var(--ok);background:#dcfce7}.sb.no{border-color:var(--no);background:#ffe4e6}.sb.wait{border-color:#f59e0b;background:#fff7e0}
#abar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 0 var(--gold)}
#abar span{flex:none;font-weight:900;font-size:14px;max-width:42%}
#abar .btn{flex:1;font-size:20px;padding:10px;box-shadow:3px 3px 0 #000}
#admin{padding-bottom:96px}
#netw{position:fixed;left:10px;right:10px;top:10px;z-index:60;background:var(--no);color:#fff;border:3px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-weight:700;box-shadow:4px 4px 0 var(--line)}
.modal{position:fixed;inset:0;background:rgba(28,29,63,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .card{width:min(440px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dist{display:flex;flex-direction:column;gap:5px}
.dist div{display:flex;align-items:center;gap:8px;font-weight:900}
.dist i{display:block;height:20px;border-radius:5px;min-width:3px}

/* ---------- 큰 화면 ---------- */
#board{max-width:none;padding:0;min-height:100vh;gap:0;color:#fff;position:relative;background:#14153a}
body.fun #board{background:linear-gradient(125deg,#1b0f4d,#4a1170 35%,#0f2a6b 70%,#1b0f4d);background-size:300% 300%;animation:bgmove 18s ease-in-out infinite}
.floaty,.hype{display:none}body.fun .floaty{display:block}body.fun .hype{display:block}
@keyframes bgmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#board .bwrap{position:relative;z-index:1}
.floaty{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaty span{position:absolute;bottom:-10vh;font-size:5vh;opacity:.22;animation:floatup linear infinite}
@keyframes floatup{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-120vh) rotate(360deg)}}
.hype{font:900 3.6vh "Noto Sans KR",sans-serif;color:#ffe27a;text-align:center;min-height:4.5vh;transition:opacity .4s}
body.fun .btitle.glow{background:linear-gradient(90deg,#ffd43b,#ff7ab8,#7ad7ff,#ffd43b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
body.fun .btitle.glow em{color:transparent}
@keyframes shine{to{background-position:300% 0}}
.pop{animation:popn .5s ease-out}
@media (prefers-reduced-motion:reduce){#board,.floaty span,.btitle.glow{animation:none}}
#board.on{display:flex}
.bwrap{flex:1;display:flex;flex-direction:column;padding:3vh 4vw;gap:2.4vh}
.btop{display:flex;justify-content:space-between;align-items:center;font:900 2.2vh "Noto Sans KR",sans-serif;color:#c9c6ff}
.btitle{font:400 7vh/1.1 "Black Han Sans",sans-serif;margin:0;color:var(--gold);word-break:keep-all}
.btitle em{font-style:normal;color:#fff}
.blob{display:grid;grid-template-columns:1.1fr .9fr;gap:4vw;flex:1;align-items:center}
.qrbox{background:#fff;padding:2.2vh;border-radius:2vh;width:min(42vh,36vw);aspect-ratio:1;justify-self:center}
.qrbox img,.qrbox canvas{width:100%!important;height:100%!important}
.blob2{display:grid;grid-template-columns:1fr auto;grid-template-rows:minmax(0,1fr);gap:3vw;flex:1;min-height:0}
#board.on{height:100vh;overflow:hidden}
#board .bwrap{min-height:0}
.bcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(15vw,1fr));gap:1vh .8vw;align-content:start;overflow:hidden;min-height:0;flex:1}
.bct{background:#25275e;border-radius:1.4vh;padding:.9vh 1vw 1.1vh;min-height:9vh}
.bct.zero{opacity:.45}
.bch{display:flex;justify-content:space-between;align-items:baseline;font:900 2.8vh "Noto Sans KR",sans-serif;border-bottom:2px solid #3a3d86;padding-bottom:.5vh;margin-bottom:.7vh}
.bch b{color:var(--gold);font:400 3vh "Black Han Sans",sans-serif}
.bcn{display:flex;flex-wrap:wrap;gap:.6vh .5vw}
.bcn span{background:#3a3d86;border-radius:.8vh;padding:.15vh .6vw;font:700 var(--nf,2.1vh) "Noto Sans KR",sans-serif}
.bcg.many{grid-template-columns:repeat(auto-fill,minmax(12.4vw,1fr))}
.bcg .bct{min-height:auto}.bcg .bch{font-size:calc(var(--nf,2.1vh) * 1.25)}
.bcn span.new{background:var(--gold);color:var(--ink);animation:popn .6s ease-out}
@keyframes popn{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.burl{font:900 3.4vh "Noto Sans KR",sans-serif;text-align:center;color:#fff;margin:1.4vh 0 0}
.bcount{font:400 16vh/1 "Black Han Sans",sans-serif;color:var(--gold);margin:0}
.bdepts{display:flex;gap:2vw;flex-wrap:wrap;font:900 3.2vh "Noto Sans KR",sans-serif}
.bdepts span{background:#25275e;border-radius:1.4vh;padding:.8vh 1.6vw}
.bnames{display:flex;flex-wrap:wrap;gap:1vh;max-height:34vh;overflow:hidden;margin-top:2vh}
.bnames span{background:#2b2d6b;border-radius:1vh;padding:.5vh 1.1vw;font:700 2.4vh "Noto Sans KR",sans-serif}
.bq{font:900 clamp(28px,5.4vh,64px)/1.35 "Noto Sans KR",sans-serif;text-align:center;margin:0;word-break:keep-all;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column}
.bq .cand{display:block;margin-top:2vh;color:var(--gold);font-size:1.2em}
.bopts{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2vw}
.bopt{display:flex;align-items:center;gap:1.6vw;border-radius:2vh;padding:2.2vh 2vw;font:900 clamp(22px,4.2vh,50px)/1.25 "Noto Sans KR",sans-serif;color:#fff;word-break:keep-all;transition:opacity .3s}
.bopt b{flex:none;width:7vh;height:7vh;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font:400 4.4vh "Black Han Sans",sans-serif}
.bopt .cnt{margin-left:auto;font:400 4.4vh "Black Han Sans",sans-serif}
.bopt.dim{opacity:.22}
.bopt.win{outline:.8vh solid var(--gold);outline-offset:.4vh}
.boxs{display:grid;grid-template-columns:1fr 1fr;gap:3vw}
.box{border-radius:3vh;font:400 22vh/1.1 "Black Han Sans",sans-serif;text-align:center;color:#fff;position:relative}
.box.dim{opacity:.22}.box.O{background:var(--o)}.box.X{background:var(--x)}
.box small{position:absolute;right:2vw;bottom:1.4vh;font-size:5vh}
.bbar{display:flex;align-items:center;gap:2vw}
.bbar .tb{flex:1;height:2.4vh;background:#2b2d6b;border-radius:2vh;overflow:hidden}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
{
/* ======================= 공통 ======================= */
const ADMIN_PIN="7777";              /* 진행자 PIN — 바꾸려면 이 숫자만 수정 */
const DEFAULT_TITLE="참빛 중고등부 성경 골든벨";
const DEFAULT_DEPTS=["중등부","고등부"];
/* 부서·학년·반 → 반 이름 목록 (예: 중등부 1학년 1반 → "중1-1반") */
const DEF_RG=[[2,2,2],[2,3,2]];   /* 부서별·학년별 반 수 (중1~3: 2반씩, 고2만 3반) */
const DEF_CM={deps:DEFAULT_DEPTS,grades:3,rm:DEF_RG};
const preOf=d=>{const t=String(d).replace(/등부$|부$/,"");return t.slice(0,1)||String(d).slice(0,1)};
function cmEntries(cm){const out=[];cm.deps.forEach((d,di)=>{for(let g=1;g<=cm.grades;g++){const n=cm.rm[di][g-1];for(let r=1;r<=n;r++)out.push({di,g,r,label:n>1?`${preOf(d)}${g}-${r}반`:`${preOf(d)}${g}`})}});return out}
const classLabels=cm=>cmEntries(cm).map(e=>e.label);
const clsIdx=(cm,di,g,r)=>cmEntries(cm).findIndex(e=>e.di===di&&e.g===g&&e.r===r);
const roomsOf=(cm,di,g)=>cm.rm[di][g-1];
function validCm(c){if(!c||!Array.isArray(c.deps)||!c.deps.length)return null;const deps=c.deps.slice(0,4).map(String);const grades=Math.max(1,Math.min(6,+c.grades||1));
  const rm=deps.map((_,di)=>Array.from({length:grades},(_,g)=>{const v=(Array.isArray(c.rm)&&Array.isArray(c.rm[di])&&c.rm[di][g]!=null)?c.rm[di][g]:(c.rooms||2);return Math.max(1,Math.min(15,+v||1))}));
  return {deps,grades,rm}}
/* 실시간 연결 채널 (ntfy.sh). 이 게임 전용 채널이라 다른 게임과 섞이지 않아요 */
const NTFY=(()=>{const q=new URLSearchParams(location.search).get("ntfy");return q&&/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(q)?q:"https://ntfy.sh"})();
const BASE=NTFY+"/nsw-goldenbell-k4v8q2";
const CTL=BASE+"-ctl",RES=BASE+"-res";

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const show=id=>{document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
let toastT=null;const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),3200)};
const LET=["①","②","③","④"];
const fmt1=n=>Math.round((+n||0)*10)/10;
const TYPE_NAME={mc:"4지선다",ox:"O/X",sa:"주관식"};
/* 대회 이름: 진행자가 준비 화면에서 쓴 이름이 학생 화면·큰 화면에 바로 보여요 */
let INFO={title:store.get("bell-title")||DEFAULT_TITLE,t:0};
function titleHtml(t){t=esc(t||DEFAULT_TITLE);return t.includes("골든벨")?t.replace("골든벨","<em>골든벨</em>"):t}
function showTitle(t){const h=document.getElementById("jH1");if(h){h.innerHTML=`<span class="bell">🔔</span> ${titleHtml(t)}`;h.style.wordBreak="keep-all";h.style.fontSize=String(t||"").length>12?"clamp(28px,8.5vw,40px)":""}document.title="🔔 "+(t||DEFAULT_TITLE)}
/* 청소년 감성 한 줄들 */
const FUN_OK=["천재 인정 🎉","성경 박사님 등장 🤓","미쳤다 이걸 맞히네 🔥","완벽 그 자체 💯","오늘 폼 미쳤다 😎","이 구역 퀴즈왕 👑"];
const FUN_NO=["아깝다 😭","괜찮아, 다음 문제 있잖아 💪","헉 이건 낚였다 🎣","다음엔 무조건 맞힌다 🙌","이건 문제가 너무했다 🤯","멘탈 잡고 다음 판! 🧘"];
const FUN_LATE=["앗, 시간 초과 ⏰","손이 느렸다… 다음엔 빠르게 ⚡","생각하다 끝나 버림 😵"];
const FUN_WAIT=["📶 와이파이 끄고 LTE 켜기!","🔋 배터리 충분하지?","👀 옆 친구 답 훔쳐보기 금지!","🙏 시작 전에 짧게 기도 한 번?","🏆 오늘의 퀴즈왕은 바로 너!"];
const HYPE=["오늘의 퀴즈왕은 누구? 👑","폰 배터리 충전했지? 🔋","와이파이 끄고 LTE로 입장! 📶","성경 좀 읽었다는 사람 손 🙋","틀려도 괜찮아, 재밌으면 장땡 😎","우리 반이 1등 먹자 🔥","QR 찍고 바로 입장! 📷"];
const CALM={ok:["정답입니다!"],no:["아쉽네요. 다음 문제에서 만회해요"],late:["시간이 지났어요"],wait:["와이파이보다 LTE(데이터)가 더 안정적이에요"]};
const funOn=()=>!!(document.body&&document.body.classList.contains("fun"));
const pickFun=(arr,seed)=>{if(!funOn()){const m=arr===FUN_OK?CALM.ok:arr===FUN_NO?CALM.no:arr===FUN_LATE?CALM.late:CALM.wait;return m[0]}return arr[Math.abs(seed|0)%arr.length]};
function setFun(on){document.body.classList.toggle("fun",!!on)}
function deviceId(){let d=store.get("bell-did");if(!d){d=Math.random().toString(36).slice(2,10);store.set("bell-did",d)}return d}
const newId=()=>Math.random().toString(36).slice(2,8);

/* 주관식 채점: 띄어쓰기·문장부호·'님' 무시, 숫자는 숫자끼리 비교 */
const norm=s=>String(s||"").normalize("NFC").toLowerCase().replace(/[\s.,!?~'"`()\[\]{}「」『』<>·:;\-_\/]/g,"").replace(/(입니다|이에요|예요)$/,"").replace(/님$/,"");
const digits=s=>String(s||"").replace(/[^0-9]/g,"");
function saMatch(a,alts){const n=norm(a);if(!n)return false;
  for(const x of alts){const m=norm(x);if(m&&m===n)return true;const dx=digits(x);if(dx&&dx===digits(a)&&n.replace(/[0-9]/g,"").length<=3)return true}
  return false}

/* ntfy 전송 (실패 시 재시도) */
async function post(url,obj,tries=4){
  const body=JSON.stringify(obj);
  for(let k=0;k<tries;k++){
    try{const r=await fetch(url,{method:"POST",body});if(r.ok)return true;if(r.status===429)await sleep(2500);else await sleep(600)}
    catch(e){await sleep(800)}
  }
  return false;
}
/* ntfy 구독 — 다시 연결되면 처음부터 다시 받으므로 id로 중복 제거 */
function subscribe(url,since,onMsg,onConn){
  const seen=new Set();
  const es=new EventSource(`${url}/sse?since=${since}`);
  es.onopen=()=>onConn&&onConn(true);
  es.onerror=()=>onConn&&onConn(false);
  es.onmessage=e=>{let m,x;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.event!=="message"||seen.has(m.id))return;seen.add(m.id);
    try{x=JSON.parse(m.message)}catch(_){return}
    if(x&&typeof x==="object")onMsg(x,(m.time||0)*1000);
  };
  return ()=>es.close();
}
function qrInto(el,text,size){el.innerHTML="";try{new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent=text}}
const joinUrl=()=>location.origin+location.pathname;
const prettyUrl=()=>joinUrl().replace(/^https?:\/\//,"").replace(/\/$/,"");

/* 순위표 문자열 "d,점수,생존,부서번호;..." (점수 높은 순) */
function parseSc(s){const out=[];if(!s)return out;for(const p of String(s).split(";")){const [d,sc,a,g]=p.split(",");if(d)out.push({d,s:+sc||0,a:a!=="0",g:+g||0})}return out}

/* 문제 그리기 (학생·큰 화면 공통) */
function qTextHtml(q){
  if(q.t==="ox"&&q.cd)return `${esc(q.tx)}<span class="cand">→ 「${esc(q.cd)}」</span>`;
  return esc(q.tx);
}
function catTags(q){
  const tags=[`<span class="tag ${q.ns?"ns":""}">${q.ns?"😆 넌센스":esc(q.c)}</span>`,`<span class="tag g">${TYPE_NAME[q.t]}</span>`];
  if(q.x>1)tags.push(`<span class="tag" style="background:var(--no)">🔥 점수 ${q.x}배</span>`);
  return tags.join(" ");
}

/* ======================= 문제 은행 ======================= */
const BOOKS=window.BELL_BOOKS.map(b=>b[0]);
const BOOK_IDX=new Map(BOOKS.map((b,i)=>[b,i]));
let ITEMS=[];
(function parseBank(){
  let id=0;
  for(const [cat,txt] of Object.entries(window.BELL_BANK)){
    for(const line of txt.split("\n")){
      const l=line.trim();if(!l)continue;const p=l.split("|").map(s=>s.trim());const k=p[0];
      if(k==="M"||k==="m"){if(p.length<6)continue;const alts=p[2].split("/").map(s=>s.trim()).filter(Boolean);
        ITEMS.push({id:id++,cat,k,q:p[1],alts,ans:alts[0],d:p.slice(3,6)})}
      else if(k==="S"){const alts=p[2].split("/").map(s=>s.trim()).filter(Boolean);ITEMS.push({id:id++,cat,k,q:p[1],alts,ans:alts[0]})}
      else if(k==="O"){ITEMS.push({id:id++,cat,k,q:p[1],ox:p[2]==="X"?"X":"O",ex:p[3]||""})}
    }
  }
})();
const canMC=it=>it.k==="M"||it.k==="m";
const canSA=it=>it.k==="S"||(it.k==="M"&&norm(it.ans).length<=8&&!/아닌/.test(it.q));
const canGenOX=it=>canMC(it)&&!/아닌|다음 말은|무엇이었나|어떤 사람/.test(it.q);

/* 범위 해석: "마태복음, 로마서", "신약", "창세기~신명기", "롬", "사무엘" … */
const baseName=b=>b.replace(/(복음|서|기)$/,"");
function resolveTok(t){
  if(!t)return [];
  const G=window.BELL_GROUPS;if(G[t]){const [a,b]=G[t];return BOOKS.slice(BOOK_IDX.get(a),BOOK_IDX.get(b)+1)}
  if(BOOK_IDX.has(t))return [t];
  const ab=window.BELL_BOOKS.find(b=>b[1]===t);if(ab)return [ab[0]];
  const byBase=BOOKS.filter(b=>baseName(b)===t||baseName(b)===baseName(t));if(byBase.length)return [byBase[0]];
  if(t.length>=2){const pre=BOOKS.filter(b=>b.startsWith(t));if(pre.length)return pre}
  return [];
}
function parseRange(text){
  const s=String(text||"").replace(/\s*[~∼〜–—-]\s*/g,"~");
  const toks=s.split(/[,，、\s\/·]+/).map(t=>t.trim()).filter(Boolean);
  const set=new Set(),unknown=[];
  for(const t of toks){
    if(t.includes("~")){const [a,b]=t.split("~");const A=resolveTok(a),B=resolveTok(b);
      if(A.length&&B.length){let i=BOOK_IDX.get(A[0]),j=BOOK_IDX.get(B[B.length-1]);if(i>j)[i,j]=[j,i];BOOKS.slice(i,j+1).forEach(x=>set.add(x))}else unknown.push(t);continue}
    const r=resolveTok(t);if(r.length)r.forEach(x=>set.add(x));else unknown.push(t);
  }
  return {books:BOOKS.filter(b=>set.has(b)),unknown};
}
function poolsFor(cats){
  const cs=new Set(cats);const its=ITEMS.filter(it=>cs.has(it.cat));
  return {mc:its.filter(canMC),ox:its.filter(it=>it.k==="O"),sa:its.filter(canSA),gen:its.filter(canGenOX),all:its};
}
/* 문제 하나 만들기 */
function mkMC(it){const opts=shuffle([it.ans,...it.d]);return {src:it.id,c:it.cat,t:"mc",tx:it.q,o:opts,cor:opts.indexOf(it.ans),ans:it.ans}}
function mkSA(it){return {src:it.id,c:it.cat,t:"sa",tx:it.q,alts:it.alts,ans:it.ans}}
function mkOX(it){return {src:it.id,c:it.cat,t:"ox",tx:it.q,ox:it.ox,ans:it.ox,ex:it.ex}}
function mkGenOX(it,truth){const cd=truth==="O"?it.ans:it.d[rnd(3)];return {src:it.id,c:it.cat,t:"ox",tx:it.q,cd,ox:truth,ans:truth,ex:truth==="X"?`정답은 「${it.ans}」`:""}}
/* O/X n개: 맞는 것·틀린 것이 반반쯤 되게 */
function pickOX(P,n,used){
  const out=[];const auth={O:shuffle(P.ox.filter(i=>i.ox==="O"&&!used.has(i.id))),X:shuffle(P.ox.filter(i=>i.ox==="X"&&!used.has(i.id)))};
  const gen=shuffle(P.gen.filter(i=>!used.has(i.id)));
  for(let k=0;k<n;k++){
    const want=Math.random()<.5?"O":"X";
    let it=null;
    if(auth[want].length&&Math.random()<.6)it=mkOX(auth[want].pop());
    else if(gen.length)it=mkGenOX(gen.pop(),want);
    else if(auth[want].length)it=mkOX(auth[want].pop());
    else{const o=want==="O"?"X":"O";if(auth[o].length)it=mkOX(auth[o].pop())}
    if(!it)break;used.add(it.src);out.push(it);
  }
  return out;
}
function pickType(P,t,n,used){
  if(t==="ox")return pickOX(P,n,used);
  const src=shuffle((t==="mc"?P.mc:P.sa).filter(i=>!used.has(i.id))).slice(0,n);
  src.forEach(i=>used.add(i.id));return src.map(t==="mc"?mkMC:mkSA);
}
/* 직접 만든 문제: "문제 | 정답 | 오답1 | 오답2 | 오답3" / "문제 | O" / "문제 | 정답" */
function parseCustom(text){
  const out=[];
  String(text||"").split("\n").forEach((l,ln)=>{const p=l.split("|").map(s=>s.trim()).filter(s=>s!=="");if(p.length<2)return;
    const base={src:"c"+ln,c:"직접 문제"};
    if(p.length>=5){const opts=shuffle(p.slice(1,5));out.push({...base,t:"mc",tx:p[0],o:opts,cor:opts.indexOf(p[1]),ans:p[1]})}
    else if(p.length===2&&/^[OoXx○×]$/.test(p[1])){const v=/^[Xx×]$/.test(p[1])?"X":"O";out.push({...base,t:"ox",tx:p[0],ox:v,ans:v})}
    else{const alts=p[1].split("/").map(s=>s.trim()).filter(Boolean);out.push({...base,t:"sa",tx:p[0],alts,ans:alts[0]})}
  });
  return out;
}
/* 설정 → 문제 구성 */
function composition(cfg){
  const gk=cfg.gkOn?cfg.gkN:0,ns=cfg.nsOn?cfg.nsN:0,my=cfg.myOn?cfg.myN:0;
  let bible=Math.max(0,cfg.total-gk-ns-my);
  let sa=cfg.saOn?Math.min(cfg.saN,bible):0;
  let ox=cfg.oxOn?Math.min(cfg.oxN,bible-sa):0;
  let mc=bible-sa-ox;
  if(!cfg.mcOn){if(cfg.oxOn){ox+=mc}else if(cfg.saOn){sa+=mc}mc=0}
  return {bible,mc,ox,sa,gk,ns,my};
}
function buildDeck(cfg){
  const C=composition(cfg),warn=[];
  const books=parseRange(cfg.range).books;
  const P=poolsFor(books),ALL=poolsFor(BOOKS);
  const used=new Set();const bible=[];
  for(const t of ["sa","ox","mc"]){
    const need=C[t];if(!need)continue;
    let got=pickType(P,t,need,used);
    if(got.length<need&&cfg.fill){const more=pickType(ALL,t,need-got.length,used);if(more.length)warn.push(`${TYPE_NAME[t]} ${more.length}문제는 범위 밖 성경에서 채웠어요`);got=got.concat(more)}
    if(got.length<need)warn.push(`${TYPE_NAME[t]} 문제가 ${need-got.length}개 모자라요`);
    bible.push(...got);
  }
  shuffle(bible);
  const specials=[];
  if(C.gk){const G=poolsFor(["상식"]);let g=pickType(G,"mc",Math.ceil(C.gk*.7),used);if(cfg.oxOn)g=g.concat(pickOX(G,C.gk-g.length,used));else g=g.concat(pickType(G,"mc",C.gk-g.length,used));if(g.length<C.gk)warn.push(`상식 문제가 ${C.gk-g.length}개 모자라요`);specials.push(...g)}
  if(C.ns){const N=poolsFor(["넌센스"]);const g=pickType(N,"mc",C.ns,used).map(q=>({...q,ns:true}));if(g.length<C.ns)warn.push(`넌센스 문제가 ${C.ns-g.length}개 모자라요`);specials.push(...g)}
  if(C.my){const my=shuffle(parseCustom(cfg.custom));if(my.length<C.my)warn.push(`직접 만든 문제가 ${C.my-my.length}개 모자라요`);specials.push(...my)}
  shuffle(specials);
  const deck=bible.slice();
  specials.forEach((s,k)=>{const pos=Math.min(deck.length,Math.round((k+1)*(bible.length+specials.length)/(specials.length+1)));deck.splice(pos,0,s)});
  /* 마지막 문제는 성경 문제로 */
  if(deck.length>1&&(deck[deck.length-1].ns||deck[deck.length-1].c==="상식")){const j=deck.map(q=>!q.ns&&q.c!=="상식").lastIndexOf(true);if(j>=0)deck.push(deck.splice(j,1)[0])}
  /* 모자라면 자동으로 채우기: 범위 안 성경 4지선다 → 다른 성경 책 → 넌센스 → 상식 */
  const C2=composition(cfg);const want=C2.bible+C2.gk+C2.ns+C2.my;const info=[];
  let need=want-deck.length;
  if(need>0){
    const fills=[["범위 안 성경 4지선다",()=>pickType(P,"mc",need,used)],["다른 성경 책 4지선다",()=>pickType(ALL,"mc",need,used)],["성경 O/X",()=>pickOX(ALL,need,used)],
      ["넌센스",()=>pickType(poolsFor(["넌센스"]),"mc",need,used).map(q=>({...q,ns:true}))],["상식",()=>pickType(poolsFor(["상식"]),"mc",need,used)]];
    for(const [nm,fn] of fills){if(need<=0)break;const add=fn();if(!add.length)continue;
      add.forEach(q=>{const pos=deck.length>1?1+rnd(deck.length-1):deck.length;deck.splice(pos,0,q)});need-=add.length;info.push(`${nm} ${add.length}문제`)}
  }
  const filled=info.length?[`모자란 문제를 자동으로 채웠어요: ${info.join(", ")}`]:[];
  deck.forEach(q=>q.uid=newId());
  return {deck,warn:need>0?warn:[],info:filled,want};
}
/* 한 문제 바꾸기 (같은 형식·같은 분류) */
function swapOne(deck,i,cfg){
  const q=deck[i];const used=new Set(deck.map(d=>d.src));
  let cats;if(q.ns)cats=["넌센스"];else if(q.c==="상식")cats=["상식"];else if(q.c==="직접 문제")return null;
  else{cats=parseRange(cfg.range).books;if(!cats.includes(q.c))cats=BOOKS}
  let P=poolsFor(cats);let r=pickType(P,q.t,1,used);
  if(!r.length&&!q.ns&&q.c!=="상식"){r=pickType(poolsFor(BOOKS),q.t,1,used)}
  if(!r.length)return null;
  const n={...r[0],uid:newId()};if(q.ns)n.ns=true;return n;
}

    if(my&&P.buzzedI!==q.i){P.buzzedI=q.i;buzz(ok?[30,40,30]:[120])}

const deptsOf=cfg=>{if(Array.isArray(cfg.lbl)&&cfg.lbl.length)return cfg.lbl.slice(0,60);const cm=cmOf(cfg);if(cm)return classLabels(cm).slice(0,60);

function qState(i){if(A.rvd&&A.rvd[i])return "revealed";if(A.clT&&A.clT[i])return "closed";if(A.qT&&A.qT[i])return "live";return "ready"}

function isCorrect(q,i,a){

function validAns(i,d){
  const m=L.ans.get(i);if(!m)return null;const r=m.get(d);if(!r)return null;

  return [...L.players].filter(([d,p])=>!excluded(d)&&p.jt<=qs+1500&&(!al||!al.get(d)||al.get(d)[i]!==false)).map(([d])=>d)}
function computeStandings(){
  /* 점수·생존을 처음부터 다시 계산 */
  const res=new Map();const alive=new Map();
  for(const [d,p] of L.players){if(excluded(d))continue;res.set(d,{d,n:p.n,g:p.g,s:0,pts:0,ok:0,ms:0,a:true});alive.set(d,{})}
  const revs=new Set(A.revives||[]);
  for(let i=0;i<A.deck.length;i++){
    for(const [d,r] of res){alive.get(d)[i]=r.a}
    if(!A.rvd||!A.rvd[i])continue;
    const q=A.deck[i];const qs=L.srv.q[i]||(A.qT&&A.qT[i])||0;
    for(const [d,r] of res){
      const p=L.players.get(d);
      if(A.cfg.elim&&!r.a)continue;
      const v=validAns(i,d);
      if(v&&isCorrect(q,i,v.a)){
        r.pts+=(q.x||1);r.ok++;r.ms+=v.ms;   /* 한 문제 1점 (마지막 문제 2배면 2점) */
      }else if(A.cfg.elim&&p.jt<=qs+1500)r.a=false;

  }
  const maxPts=A.deck.reduce((t,q,i)=>t+(q.x||((A.cfg.last2&&i===A.deck.length-1)?2:1)),0)||1;
  for(const r of res.values())r.s=fmt1(r.pts/maxPts*100);
  const list=[...res.values()].sort((a,b)=>(A.cfg.elim?(b.a-a.a):0)||b.pts-a.pts||b.ok-a.ok||a.ms-b.ms||a.n.localeCompare(b.n));
  return {list,alive};

function scString(list,max=2600){let s=list.map(r=>`${r.d},${r.s},${r.a?1:0},${r.g}`).join(";");while(s.length>max){list=list.slice(0,Math.floor(list.length*.85));s=list.map(r=>`${r.d},${r.s},${r.a?1:0},${r.g}`).join(";")}return s}
function deptSummary(list){
  const ds=deptsOf(A.cfg);return ds.map((g,gi)=>{const m=list.filter(r=>r.g===gi);const avg=m.length?fmt1(m.reduce((a,r)=>a+r.s,0)/m.length):0;

    <button class="btn red" data-rs="all" style="font-size:19px">🗑 완전 리셋 (설정 화면으로)<small style="display:block;font:700 13px 'Noto Sans KR'">학생은 입장 화면으로 돌아가요</small></button>
    <button class="btn sub" data-rs="no">취소</button></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{if(e.target===m)m.remove()});

    const k=b.dataset.rs;m.remove();if(k==="no")return;
    const old=A.rid;
    if(old)await ctl({k:"reset",r:old});
    if(L.unsubRes){L.unsubRes();L.unsubRes=null}

    if(k==="all"){A={cfg:A.cfg,deck:A.deck,warn:A.warn,phase:"setup"};saveA();renderAdmin();toast("완전히 리셋했어요");return}

  }));
}
function modal(html,onSave){
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card">${html}<div class="big2"><button class="btn" id="mOk" style="font-size:20px">저장</button><button class="btn sub" id="mNo">취소</button></div></div>`;

function editPlayer(d){

function editClasses(){

let B={rid:null,openT:0};let bUnsub=null;
function freshB(x,t){return {rid:x.r,openT:t,title:x.title||DEFAULT_TITLE,depts:x.depts||DEFAULT_DEPTS,n:x.n||0,elim:!!x.elim,joins:new Map(),ans:new Map(),view:"lobby",q:null,qStart:0,dl:0,closed:false,rv:null,rk:null,end:null}}
function initBoard(){
  show("board");document.title="📺 성경 골든벨";
  boardIdle();boardFx();
  subscribe(CTL,"all",onBoardCtl,ok=>{const c=$("#bConn");if(c)c.textContent=ok?"● 연결됨":"○ 연결 중…"});
  setInterval(boardTick,200);
}
const boardIdle=()=>{$("#board").innerHTML=`<div class="bwrap" style="justify-content:center;align-items:center;gap:3vh;height:100vh"><p style="font-size:14vh;margin:0" class="bell">🔔</p><p class="btitle glow" style="text-align:center;font-size:10vh;line-height:1.15">${titleHtml(INFO.title)}</p><p class="hype" id="bHype">${HYPE[0]}</p><p class="bex" style="font-size:2.6vh;opacity:.8">진행자가 대회를 열면 여기에 입장 QR이 떠요</p></div>`};
function boardFx(){if(document.querySelector(".floaty"))return;const f=document.createElement("div");f.className="floaty";const em=["🔔","📖","✨","❓","💡","⭐","🎉","🙏","👑","🔥"];
  for(let k=0;k<18;k++){const e=document.createElement("span");e.textContent=em[k%em.length];e.style.left=(Math.random()*96)+"vw";e.style.animationDuration=(14+Math.random()*16)+"s";e.style.animationDelay=(-Math.random()*25)+"s";e.style.fontSize=(3+Math.random()*4)+"vh";f.appendChild(e)}
  document.body.appendChild(f);let h=0;setInterval(()=>{const el=$("#bHype");if(!el)return;h++;el.style.opacity=0;setTimeout(()=>{el.textContent=HYPE[h%HYPE.length];el.style.opacity=1},400)},3500)}
function onBoardCtl(x,t){
  if(x.k==="info"){if(t>=INFO.t&&typeof x.title==="string"){INFO={title:x.title.slice(0,30),t,fun:!!x.fun};if(!B.rid||t>=B.openT)setFun(INFO.fun);if(!B.rid)boardIdle();else if(t>=B.openT){B.title=INFO.title;bSoon()}}return}
  if(x.k==="reset"){if(B.rid&&x.r===B.rid){B={rid:null,openT:t};if(bUnsub){bUnsub();bUnsub=null}const c=document.querySelector(".confetti");if(c)c.remove();boardIdle()}return}
  if(x.k==="open"){if(t<B.openT)return;B=freshB(x,t);setFun(x.fun);if(bUnsub)bUnsub();bUnsub=subscribe(RES,Math.floor(t/1000)-30,onBoardRes);bSoon();return}
  if(!B.rid||x.r!==B.rid)return;
  if(x.k==="q"){const fresh=Date.now()-t<8000;B.q=x;B.qStart=fresh?Date.now():t;B.dl=B.qStart+x.s*1000;B.closed=Date.now()>=B.dl;B.rv=null;B.view="q"}
  else if(x.k==="cl"){if(B.q&&x.i===B.q.i)B.closed=true}
  else if(x.k==="rv"){if(B.q&&x.i===B.q.i){B.rv=x;B.closed=true;B.view="rv"}}
  else if(x.k==="rk"){B.rk=x;B.view="rk"}
  else if(x.k==="cr"){B.cr=x;B.view="cr";B.crFresh=Date.now()-t<60000}
  else if(x.k==="vw"){if(x.v==="end"&&B.end){B.view="end";B.endFresh=false}}
  else if(x.k==="ed"){const j=B.joins.get(x.d);if(j){j.n=String(x.n||j.n).slice(0,10);j.g=+x.g||0}}
  else if(x.k==="dp"){if(Array.isArray(x.depts)&&x.depts.length)B.depts=x.depts.slice(0,60)}
  else if(x.k==="rev"){B.view=B.view==="rv"?"rv":B.view;B.revived=Date.now()}
  else if(x.k==="end"){B.end=x;B.view="end";B.endFresh=Date.now()-t<60000}
  bSoon();
}
function onBoardRes(x,t){
  if(x.r!==B.rid||typeof x.d!=="string")return;
  if(x.t==="j"){B.joins.set(x.d,{n:String(x.n||"").slice(0,10),g:+x.g||0});if(Date.now()-t<10000){B.newest=x.d;B.newAt=Date.now()}if(B.view==="lobby")bSoon()}
  else if(x.t==="a"){const i=+x.i;if(!B.ans.has(i))B.ans.set(i,new Set());B.ans.get(i).add(x.d);if(B.view==="q"){const el=$("#bNa");if(el)el.textContent=B.ans.get(i).size;const w=$("#bWait");if(w)w.innerHTML=boardWait(i)}}
}
let brq=0;function bSoon(){if(brq)return;brq=requestAnimationFrame(()=>{brq=0;renderBoard()})}
function boardTick(){
  if(B.view!=="q"||!B.q)return;const left=B.dl-Date.now();
  const tl=$("#bTl");if(!tl)return;
  if(left<=0&&!B.closed){B.closed=true;renderBoard();return}
  tl.textContent=Math.max(0,Math.ceil(left/1000));$("#bTb").style.width=Math.max(0,left/(B.q.s*1000)*100)+"%";$("#bBar").classList.toggle("hurryb",left<=5000);
}
const dname=g=>esc(B.depts[g]||"");
function bFoot(){return `<div class="bfoot"><span>${esc(B.title||"")}</span><span><span id="bConn">● 연결됨</span> · <a href="./" target="_blank" rel="noopener">학생 화면</a> · <a href="#admin" target="_blank" rel="noopener">🛠 진행자 화면</a></span></div>`}
function boardWait(i){const got=B.ans.get(i)||new Set();const left=[...B.joins.entries()].filter(([d])=>!got.has(d)).map(([,j])=>j.n);
  if(!B.joins.size)return "";if(!left.length)return "🎉 모두 제출했어요!";
  return `⏳ 아직 안 낸 사람 ${left.length}명${left.length<=15?": "+left.map(esc).join(", "):""}`}
function rankRows(top,max){return (top||[]).slice(0,max).map((r,k)=>`<div class="${B.elim&&r[3]===0?"dead":""}"><b>${k+1}</b><span>${esc(r[0])}<em>${dname(r[1])}</em></span><span class="s">${r[2]}${B.elim&&r[3]===0?" 💀":""}</span></div>`).join("")}
function renderBoard(){
  const el=$("#board");if(!B.rid)return;
  if(B.view!=="end"&&B.view!=="cr"){const c=document.querySelector(".confetti");if(c)c.remove()}
  const head=`<div class="btop"><span>🔔 ${esc(B.title)}</span><span>참가 ${B.joins.size}명</span></div>`;
  if(B.view==="lobby"){
    const all=[...B.joins.entries()];
    const tiles=B.depts.map((d,gi)=>{const m=all.filter(([,j])=>j.g===gi);
      return `<div class="bct ${m.length?"":"zero"}"><div class="bch"><span>${esc(d)}</span><b>${m.length}명</b></div><div class="bcn">${m.map(([id,j])=>`<span class="${id===B.newest&&Date.now()-B.newAt<4000?"new":""}">${esc(j.n)}</span>`).join("")}</div></div>`}).join("");
    el.innerHTML=`<div class="bwrap">${head}<div class="blob2"><div style="display:flex;flex-direction:column;gap:1.6vh;min-height:0;overflow:hidden">
      <div class="row" style="align-items:flex-end;gap:3vw"><div style="flex:1"><p class="btitle" style="font-size:6vh"><span class="bell">🔔</span> <span class="btitle glow" style="font-size:inherit">${esc(B.title)}</span></p>
      <p class="bex" style="text-align:left;margin-top:.6vh">총 ${B.n}문제 · 4지선다 · O/X · 주관식 · 😆 넌센스${B.elim?" · 틀리면 탈락!":""}</p><p class="hype" id="bHype" style="text-align:left;margin:.6vh 0 0">${HYPE[0]}</p></div>
      <p class="bcount" style="flex:none;font-size:11vh">${B.joins.size}<span style="font-size:4vh;color:#fff"> 명 입장</span></p></div>
      <div class="bcg">${tiles}</div></div>
      <div><div class="qrbox" id="bQr" style="width:min(34vh,26vw)"></div><p class="burl" style="font-size:2.6vh">${esc(prettyUrl())}</p></div></div>${bFoot()}</div>`;
    qrInto($("#bQr"),joinUrl(),512);
    {const g=$(".bcg");if(g){g.classList.toggle("many",B.depts.length>12);let f=2.1;g.style.setProperty("--nf",f+"vh");
      while(g.scrollHeight>g.clientHeight+2&&f>1.1){f-=.1;g.style.setProperty("--nf",f.toFixed(2)+"vh")}}}
    return;
  }
  if(B.view==="end"){
    const E=B.end;const t=E.top||[];
    const pod=(r,k)=>r?`<div class="pod p${k+1}"><span class="nm">${esc(r[0])}</span><span class="dp">${dname(r[1])}</span><div class="st">${k+1}<small>${r[2]}점</small></div></div>`:`<div class="pod p${k+1}"></div>`;
    const eMany=(E.dep||[]).length>3;
    const dep=eMany?`<p class="bex" style="font-weight:900;color:var(--gold)">🏫 반 평균 1등: ${(E.dep||[]).slice().sort((x,y)=>y.avg-x.avg).slice(0,3).map((d,k)=>`${["🥇","🥈","🥉"][k]} ${dname(d.g)} ${d.avg}점`).join(" &nbsp; ")}</p>`:(E.dep||[]).map(d=>`<div><p class="bex" style="text-align:left;font-weight:900;color:var(--gold)">${dname(d.g)} 1등 · ${esc(d.top[0]?d.top[0][0]:"-")} (${d.top[0]?d.top[0][1]:0}점) · 평균 ${d.avg}점 · ${d.cnt}명</p></div>`).join("");
    el.innerHTML=`<div class="bwrap">${head}<p class="btitle" style="text-align:center">👑 오늘의 퀴즈왕</p><div class="podium">${pod(t[1],1)}${pod(t[0],0)}${pod(t[2],2)}</div>${dep}${bFoot()}</div>`;
    if(B.endFresh)confetti();return;
  }
  if(B.view==="cr"){
    const R=B.cr,d=R.dep||[];
    const pod=(x,k)=>x?`<div class="pod p${k+1}"><span class="nm">${dname(x.g)}</span><span class="dp">${x.cnt}명 · 평균</span><div class="st">${k+1}<small>${x.avg}점</small></div></div>`:`<div class="pod p${k+1}"></div>`;
    const rest=d.slice(3).map((x,k)=>`<span>${k+4}. ${dname(x.g)} <b style="color:var(--gold)">${x.avg}</b> <small>(${x.cnt}명)</small></span>`).join("");
    el.innerHTML=`<div class="bwrap">${head}<p class="btitle" style="text-align:center">🏫 ${R.fin?"최종 ":""}반별 순위 <span style="font-size:3vh;color:#c9c6ff">(반 평균 점수)</span></p>
      <div class="podium" style="padding-top:2vh">${pod(d[1],1)}${pod(d[0],0)}${pod(d[2],2)}</div>

    if(R.fin&&B.crFresh)confetti();return;
  }

    const cols=many?manyCol:(R.dep||[]).map(d=>`<div><h2 style="color:var(--gold);font-size:4vh;margin-bottom:1.4vh">${dname(d.g)} <small style="font:900 2.4vh 'Noto Sans KR';color:#c9c6ff">평균 ${d.avg}점 · ${d.cnt}명</small></h2><div class="brank">${d.top.slice(0,5).map((r,k)=>`<div class="${B.elim&&r[2]===0?"dead":""}"><b>${k+1}</b><span>${esc(r[0])}</span><span class="s">${r[1]}</span></div>`).join("")}</div></div>`).join("");
    el.innerHTML=`<div class="bwrap">${head}<p class="btitle">📊 현재 순위</p><div class="bsplit"><div><h2 style="font-size:4vh;margin-bottom:1.4vh">전체 TOP 10</h2><div class="brank">${rankRows(R.top,10)}</div></div><div class="bcols" style="grid-template-columns:1fr">${cols}</div></div>${bFoot()}</div>`;
    return;
  }
  const q=B.q;if(!q)return;

  let area="";
  if(q.t==="mc"){
    const d=R&&R.dist||[0,0,0,0];
    area=`<div class="bopts">${q.o.map((o,k)=>`<div class="bopt o${k} ${R?(k===R.cor?"win":"dim"):""}"><b>${k+1}</b>${esc(o)}${R?`<span class="cnt">${d[k]}명</span>`:""}</div>`).join("")}</div>`;
  }else if(q.t==="ox"){

  }else if(!R){area=`<p class="bex" style="font-size:4vh">✍️ 폰에 정답을 써서 제출하세요!</p>`}
  if(!R){
    const na=(B.ans.get(q.i)||new Set()).size;
    el.innerHTML=`<div class="bwrap">${qhead}<p class="bq">${qTextHtml(q)}</p>${area}
      <div class="bbar" id="bBar"><span class="tl" id="bTl">${q.s}</span><div class="tb"><i id="bTb"></i></div><span class="sub">제출 <b id="bNa">${na}</b> / ${B.joins.size}명</span></div><p class="bwait" id="bWait">${boardWait(q.i)}</p>${bFoot()}</div>
      <div class="bclose ${B.closed?"on":""}">⏰ 마감!</div>`;
    boardTick();return;
  }
  const ansTxt=q.t==="mc"?`${LET[R.cor]} ${esc(q.o[R.cor])}`:q.t==="ox"?R.cor:esc(R.ans);
  const rate=R.na?Math.round(R.ok/R.na*100):0;

    <div class="bsplit"><div style="display:flex;flex-direction:column;gap:2vh;justify-content:center">
      <div class="bans"><small>정답</small>${ansTxt}</div>${R.ex?`<p class="bex">${esc(R.ex)}</p>`:""}
      ${q.t==="sa"?"":area}
      ${funOn()?`<p class="bex" style="font-size:3.6vh;color:#fff">${rate>=80?"다들 성경 좀 읽었네? 😎":rate>=50?"오~ 반 이상 맞혔다! 👏":rate>=20?"이건 좀 어려웠지? 🤯":"역대급 난이도 💀 다음 문제로 만회하자!"}</p>`:""}
      <p class="bex">정답자 <b style="color:var(--gold)">${R.ok}</b>명 / 제출 ${R.na}명 (${rate}%)${B.elim?` · 🔔 생존 <b style="color:var(--gold)">${R.surv}</b>명`:""}</p>
    </div><div><h2 style="font-size:4vh;margin-bottom:1.4vh">🏅 TOP 5</h2><div class="brank">${rankRows(R.top,5)}</div></div></div>${bFoot()}</div>`;
}
function confetti(){
  if(document.querySelector(".confetti"))return;const c=document.createElement("div");c.className="confetti";
  const cols=["#ffbf1f","#ef4444","#2f7cf6","#16a34a","#9b5cf6","#fff"];
  for(let k=0;k<120;k++){const i=document.createElement("i");i.style.left=Math.random()*100+"vw";i.style.background=cols[k%cols.length];i.style.animationDuration=(3+Math.random()*4)+"s";i.style.animationDelay=Math.random()*3+"s";c.appendChild(i)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),9000);
}

const hash=location.hash.slice(1);
window.addEventListener("hashchange",()=>location.reload());
if(hash==="admin")gate(initAdmin);
else if(hash==="board")initBoard();
else initPlayer();
}
